<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BakeMap</title>
<style>
:root{--bg:#fdf8f5;--card:rgba(255,255,255,.92);--pri:#c26d42;--pri-l:#fae8df;--txt:#3e2723;--mut:#8d6e63;--brd:rgba(194,109,66,.22);--red:#d9534f;--ora:#f0ad4e;--grn:#5cb85c}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background-color:var(--bg);background-size:cover;background-position:center;background-attachment:fixed;color:var(--txt);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
body::before{content:"";position:fixed;inset:0;background:rgba(253,248,245,.85);z-index:-1}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:6px}
.hdr-right{display:flex;gap:6px}
.icon-btn{background:var(--card);border:1px solid var(--brd);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;flex-shrink:0}
.title-box{text-align:center;flex:1}.title-box h1{color:var(--pri);font-size:21px;font-weight:800}.title-box p{color:var(--mut);font-size:11px}
.calendar-card{background:var(--card);border:1px solid var(--brd);width:100%;max-width:480px;border-radius:22px;padding:14px}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month-nav h2{font-size:18px}
.nav-arrows button{background:var(--pri-l);color:var(--pri);border:none;border-radius:10px;width:36px;height:36px;font-size:18px;font-weight:700;cursor:pointer;margin-left:6px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:8px}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-cell{min-height:52px;border-radius:12px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;cursor:pointer;background:rgba(255,255,255,.75)}
.day-cell.other-month{opacity:.35}.day-cell.today{border:2px solid var(--pri);background:#fff}
.day-num{font-size:14px;font-weight:700}.order-badge{color:#fff;font-size:9px;font-weight:700;padding:2px 3px;border-radius:5px;width:95%;text-align:center;overflow:hidden;text-overflow:ellipsis}
.st-unpaid{background:var(--red)}.st-deposit{background:var(--ora)}.st-paid{background:var(--grn)}
.bottom-actions{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.action-btn{background:var(--card);border:1px solid var(--brd);color:var(--txt);padding:13px 8px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(62,39,35,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}.modal-overlay.active{display:flex}
.modal-content{background:#fffaf7;width:100%;max-width:480px;max-height:88vh;border-radius:24px 24px 0 0;padding:18px 16px 28px;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--brd)}
.close-btn{background:var(--pri-l);color:var(--pri);border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
.order-item{background:#fff;border:1px solid var(--brd);border-radius:16px;padding:12px;margin-bottom:12px;border-left:5px solid var(--pri)}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}.order-client{font-weight:700;font-size:15px}
.time-tag{display:inline-block;background:var(--pri-l);color:var(--pri);font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;margin-bottom:6px}
.order-product{color:var(--pri);font-weight:700;font-size:14px;margin-bottom:6px}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.order-price{font-weight:800;font-size:14px}.status-pill{border:none;color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer}
.deposit-box{background:#fff8eb;border:1px solid #f0ad4e;border-radius:12px;padding:10px;margin:8px 0}
.deposit-inputs{display:flex;gap:8px;margin-top:6px}.deposit-inputs input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--brd);border-radius:8px;font-size:15px}
.deposit-save{background:var(--ora);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.deposit-info{font-size:12px;color:#b45309;font-weight:600;margin-top:6px}.order-notes{font-size:13px;white-space:pre-line;margin-bottom:8px;color:#5d4037}
.order-img{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:6px;cursor:pointer}
.delete-btn{background:#fee2e2;color:var(--red);border:none;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.form-group{margin-bottom:10px}.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--mut)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--brd);border-radius:12px;font-size:16px;background:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-primary{background:var(--pri);color:#fff;border:none;width:100%;padding:13px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.stat-box{background:#fff;border:1px solid var(--brd);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.stat-label{font-size:14px;font-weight:700}.stat-sub{font-size:12px;color:var(--mut);margin-top:2px}.stat-val{font-size:18px;font-weight:800}
.week-day-group{margin-bottom:14px}.week-day-title{font-size:14px;font-weight:800;color:var(--pri);margin-bottom:6px;text-transform:capitalize}
.search-input{width:100%;padding:12px;border:2px solid var(--pri);border-radius:14px;font-size:16px;margin-bottom:12px;background:#fff}
.search-card{background:#fff;border:1px solid var(--brd);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.img-viewer.active{display:flex}.img-viewer img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<header><button class="icon-btn" onclick="openBackupModal()">⚙️</button><div class="title-box"><h1>BakeMap</h1><p>Plánovač zakázek a pečení</p></div><div class="hdr-right"><button class="icon-btn" onclick="openSearchModal()">🔍</button><button class="icon-btn" onclick="goToToday()">📅</button></div></header>
<div class="calendar-card"><div class="month-nav"><h2 id="monthYearLabel"></h2><div class="nav-arrows"><button onclick="changeMonth(-1)">‹</button><button onclick="changeMonth(1)">›</button></div></div><div class="weekdays"><div>PO</div><div>ÚT</div><div>ST</div><div>ČT</div><div>PÁ</div><div>SO</div><div>NE</div></div><div class="days-grid" id="daysGrid"></div></div>
<div class="bottom-actions"><button class="action-btn" onclick="openWeekModal()">📋 Plán na 7 dní</button><button class="action-btn" onclick="openStatsModal()">💰 Přehled tržeb</button></div>
<div class="modal-overlay" id="dayModal" onclick="closeModalOnBg(event,'dayModal')"><div class="modal-content"><div class="modal-header"><h3 id="selectedDateTitle"></h3><button class="close-btn" onclick="closeModal('dayModal')">✕</button></div><div id="ordersList"></div><div style="margin:16px 0 10px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center"><span id="formTitle">➕ Přidat novou zakázku</span><button type="button" id="cancelEditBtn" onclick="resetFormState()" style="background:#eee;color:#333;border:none;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:none">Zrušit úpravu</button></div><form id="orderForm" onsubmit="saveOrder(event)"><div class="form-group"><label>Jméno zákazníka *</label><input type="text" id="clientName" placeholder="Např. Paní Nováková" required></div><div class="form-group"><label>Co se bude péct *</label><input type="text" id="productType" placeholder="Např. Čokoládový dort" required></div><div class="form-row"><div class="form-group"><label>Čas vyzvednutí</label><input type="time" id="pickupTime"></div><div class="form-group"><label>Celková cena (Kč)</label><input type="number" id="orderPrice" placeholder="1200" min="0"></div></div><div class="form-group"><label>Stav platby</label><select id="orderStatus" onchange="toggleFormDeposit()"><option value="unpaid">🔴 Nezaplaceno</option><option value="deposit">🟠 Záloha</option><option value="paid">🟢 Zaplaceno / Hotovo</option></select></div><div class="form-group" id="formDepositGroup" style="display:none"><label>Výše složené zálohy (Kč)</label><input type="number" id="orderDeposit" placeholder="Např. 500" min="0"></div><div class="form-group"><label>Požadavky a detaily</label><textarea id="orderNotes" rows="3" placeholder="Příchuť, bez ořechů, nápis..."></textarea></div><div class="form-group"><label id="photoLabel">Referenční fotka</label><input type="file" id="orderPhoto" accept="image/*"></div><button type="submit" class="btn-primary" id="submitBtn">Uložit zakázku</button></form></div></div>
<div class="modal-overlay" id="searchModal" onclick="closeModalOnBg(event,'searchModal')"><div class="modal-content"><div class="modal-header"><h3>🔍 Vyhledat zakázku</h3><button class="close-btn" onclick="closeModal('searchModal')">✕</button></div><input type="text" id="searchInput" class="search-input" placeholder="Zadejte jméno, dort nebo poznámku..." oninput="runSearch()"><div id="searchResults"></div></div></div>
<div class="modal-overlay" id="weekModal" onclick="closeModalOnBg(event,'weekModal')"><div class="modal-content"><div class="modal-header"><h3>📋 Plán na nejbližších 7 dní</h3><button class="close-btn" onclick="closeModal('weekModal')">✕</button></div><div id="weekList"></div></div></div>
<div class="modal-overlay" id="statsModal" onclick="closeModalOnBg(event,'statsModal')"><div class="modal-content"><div class="modal-header"><h3>💰 Přehled tržeb</h3><button class="close-btn" onclick="closeModal('statsModal')">✕</button></div><div id="statsContent"></div></div></div>
<div class="modal-overlay" id="backupModal" onclick="closeModalOnBg(event,'backupModal')"><div class="modal-content"><div class="modal-header"><h3>Záloha dat</h3><button class="close-btn" onclick="closeModal('backupModal')">✕</button></div><button class="btn-primary" onclick="exportData()" style="margin-bottom:12px">⬇️ Stáhnout zálohu</button><div class="form-group"><label>Obnovit ze souboru:</label><input type="file" accept=".json" onchange="importData(event)"></div></div></div>
<div class="img-viewer" id="imgViewer" onclick="this.classList.remove('active')"><img id="fullImg" src=""></div>
<script>
var currentDate=new Date(),selectedDateKey="",editingIndex=-1,ordersData=JSON.parse(localStorage.getItem('bakeMapOrders'))||{};
var monthsCz=new Array("Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec");
var cakePhotos=new Array("https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com","https://unsplash.com");
function getDayList(k){return Reflect.get(ordersData,k)||new Array();}
function renderCalendar(){var y=currentDate.getFullYear(),m=currentDate.getMonth();document.body.style.backgroundImage="url('"+cakePhotos.at(m)+"')";document.getElementById('monthYearLabel').textContent=monthsCz.at(m)+" "+y;var f=new Date(y,m,1),l=new Date(y,m+1,0),s=f.getDay()-1;if(s===-1)s=6;var g=document.getElementById('daysGrid');g.innerHTML="";var p=new Date(y,m,0).getDate(),t=new Date();for(var i=s;i>0;i--)g.appendChild(createDayCell(y,m-1,p-i+1,true));for(var d=1;d<=l.getDate();d++)g.appendChild(createDayCell(y,m,d,false,d===t.getDate()&&m===t.getMonth()&&y===t.getFullYear()));var r=(g.children.length<=35?35:42)-g.children.length;for(var d=1;d<=r;d++)g.appendChild(createDayCell(y,m+1,d,true));}
function createDayCell(y,m,d,o,t){var dt=new Date(y,m,d),k=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,'0')+"-"+String(dt.getDate()).padStart(2,'0'),c=document.createElement('div');c.className="day-cell"+(o?" other-month":"")+(t?" today":"");c.onclick=function(){openDayModal(k,dt);};var n=document.createElement('span');n.className='day-num';n.textContent=dt.getDate();c.appendChild(n);var doList=getDayList(k);if(doList.length>0){var b=document.createElement('div'),first=doList.at(0),st=first.status||'unpaid';b.className='order-badge st-'+st;b.textContent=doList.length===1?first.client:doList.length+" zakázky";c.appendChild(b);}return c;}
function changeMonth(d){currentDate.setMonth(currentDate.getMonth()+d);renderCalendar();}
function goToToday(){currentDate=new Date();renderCalendar();}
function toggleFormDeposit(){var st=document.getElementById('orderStatus').value;document.getElementById('formDepositGroup').style.display=st==='deposit'?'block':'none';}
function openDayModal(k,dt){selectedDateKey=k;resetFormState();document.getElementById('selectedDateTitle').textContent=dt.getDate()+". "+monthsCz.at(dt.getMonth()).toLowerCase()+" "+dt.getFullYear();renderOrdersList();document.getElementById('dayModal').classList.add('active');}
function getStatusLabel(st){if(st==='paid')return'🟢 Zaplaceno';if(st==='deposit')return'🟠 Záloha';return'🔴 Nezaplaceno';}
function cycleStatus(idx){var o=getDayList(selectedDateKey).at(idx),cur=o.status||'unpaid';if(cur==='unpaid')o.status='deposit';else if(cur==='deposit')o.status='paid';else o.status='unpaid';localStorage.setItem('bakeMapOrders',JSON.stringify(ordersData));renderOrdersList();renderCalendar();}
function updateDeposit(idx){var val=Number(document.getElementById('depInput_'+idx).value)||0;getDayList(selectedDateKey).at(idx).deposit=val;localStorage.setItem('bakeMapOrders',JSON.stringify(ordersData));renderOrdersList();renderCalendar();}
function editOrder(idx){var o=getDayList(selectedDateKey).at(idx);editingIndex=idx;document.getElementById('clientName').value=o.client||'';document.getElementById('productType').value=o.product||'';document.getElementById('pickupTime').value=o.time||'';document.getElementById('orderPrice').value=o.price||'';document.getElementById('orderStatus').value=o.status||'unpaid';toggleFormDeposit();document.getElementById('orderDeposit').value=o.deposit||'';document.getElementById('orderNotes').value=o.notes||'';document.getElementById('formTitle').textContent='✏️ Upravit zakázku';document.getElementById('submitBtn').textContent='Uložit změny';document.getElementById('cancelEditBtn').style.display='inline-block';document.getElementById('photoLabel').textContent='Změnit fotku (nepovinné, původní zůstane)';document.getElementById('orderForm').scrollIntoView({behavior:'smooth'});}
function resetFormState(){editingIndex=-1;document.getElementById('orderForm').reset();toggleFormDeposit();document.getElementById('formTitle').textContent='➕ Přidat novou zakázku';document.getElementById('submitBtn').textContent='Uložit zakázku';document.getElementById('cancelEditBtn').style.display='none';document.getElementById('photoLabel').textContent='Referenční fotka';}
function renderOrdersList(){var l=document.getElementById('ordersList'),doList=getDayList(selectedDateKey);if(doList.length===0){l.innerHTML='Na tento den zatím nejsou žádné zakázky.';return;}doList.sort(function(a,b){return(a.time||'99:99').localeCompare(b.time||'99:99');});var h="";for(var i=0;i<doList.length;i++){var o=doList.at(i),pr=Number(o.price)||0,dep=Number(o.deposit)||0,st=o.status||'unpaid';h+='👤 '+escapeHtml(o.client)+'✏️ UpravitSmazat';if(o.time)h+='🕒 Vyzvednutí: '+escapeHtml(o.time)+'';h+='🎂 '+escapeHtml(o.product)+'💵 '+(pr>0?pr.toLocaleString('cs-CZ')+' Kč':'Cena nezadána')+''+getStatusLabel(st)+'';if(st==='deposit'){var rem=Math.max(0,pr-dep);h+='Záloha celkem (Kč) – lze kdykoli navýšit:Uložit';if(pr>0)h+='Složeno: '+dep.toLocaleString('cs-CZ')+' Kč | Zbývá doplatit: '+rem.toLocaleString('cs-CZ')+' Kč';h+='';}if(o.notes)h+=''+escapeHtml(o.notes)+'';if(o.photo)h+='';h+='';}l.innerHTML=h;}
  function openSearchModal(){document.getElementById('searchInput').value="";runSearch();document.getElementById('searchModal').classList.add('active');setTimeout(function(){document.getElementById('searchInput').focus();},100);}
function runSearch(){var q=document.getElementById('searchInput').value.trim().toLowerCase(),resEl=document.getElementById('searchResults'),ks=Object.keys(ordersData).sort().reverse(),matches=new Array();for(var k=0;k<ks.length;k++){var dk=ks.at(k),dl=getDayList(dk);for(var j=0;j<dl.length;j++){var o=dl.at(j),txt=(o.client+" "+o.product+" "+(o.notes||"")).toLowerCase();if(!q||txt.indexOf(q)!==-1)matches.push({key:dk,order:o});}}if(matches.length===0){resEl.innerHTML='<p style="color:var(--mut);text-align:center;padding:16px 0">Žádná zakázka nenalezena.</p>';return;}var h="";for(var i=0;i<matches.length;i++){var m=matches.at(i),parts=m.key.split("-"),dStr=Number(parts.at(2))+". "+monthsCz.at(Number(parts.at(1))-1).toLowerCase()+" "+parts.at(0),pr=Number(m.order.price)||0;h+='<div class="search-card" onclick="jumpToDate(\''+m.key+'\')"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--pri);font-weight:700;margin-bottom:4px"><span>📅 '+dStr+(m.order.time?' • 🕒 '+escapeHtml(m.order.time):'')+'</span><span>'+(pr>0?pr.toLocaleString('cs-CZ')+' Kč':'')+'</span></div><div style="font-weight:700;font-size:15px">👤 '+escapeHtml(m.order.client)+' – 🎂 '+escapeHtml(m.order.product)+'</div>';if(m.order.notes)h+='<div style="font-size:12px;color:var(--mut);margin-top:3px">'+escapeHtml(m.order.notes)+'</div>';h+='</div>';}resEl.innerHTML=h;}
function jumpToDate(k){var parts=k.split("-"),dt=new Date(Number(parts.at(0)),Number(parts.at(1))-1,Number(parts.at(2)));closeModal('searchModal');currentDate=new Date(dt.getFullYear(),dt.getMonth(),1);renderCalendar();openDayModal(k,dt);}
function openWeekModal(){var wl=document.getElementById('weekList'),h="",found=false,base=new Date();for(var i=0;i<7;i++){var dt=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i),k=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,'0')+"-"+String(dt.getDate()).padStart(2,'0'),dl=getDayList(k);if(dl.length>0){found=true;dl.sort(function(a,b){return(a.time||'99:99').localeCompare(b.time||'99:99');});h+='<div class="week-day-group"><div class="week-day-title">'+(i===0?'Dnes – ':i===1?'Zítra – ':'')+dt.getDate()+'. '+monthsCz.at(dt.getMonth()).toLowerCase()+'</div>';for(var j=0;j<dl.length;j++){var o=dl.at(j);h+='<div class="order-item" style="margin-bottom:8px;padding:10px"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span>'+(o.time?'🕒 '+escapeHtml(o.time)+' – ':'')+escapeHtml(o.client)+'</span><span>'+(o.price?Number(o.price).toLocaleString('cs-CZ')+' Kč':'')+'</span></div><div style="color:var(--pri);font-size:13px;font-weight:600">🎂 '+escapeHtml(o.product)+'</div>'+(o.notes?'<div style="font-size:12px;color:#5d4037;margin-top:3px">'+escapeHtml(o.notes)+'</div>':'')+'</div>';}h+='</div>';}}if(!found)h='<p style="color:var(--mut);text-align:center;padding:20px 0">Na nejbližších 7 dní nemáte žádné naplánované zakázky.</p>';wl.innerHTML=h;document.getElementById('weekModal').classList.add('active');}
function openStatsModal(){var ty=String(currentDate.getFullYear()),mp=ty+"-"+String(currentDate.getMonth()+1).padStart(2,'0'),mPaid=0,mUnpaid=0,mc=0,yPaid=0,yUnpaid=0,yc=0,ks=Object.keys(ordersData);for(var k=0;k<ks.length;k++){var dk=ks.at(k),dl=getDayList(dk);if(dk.startsWith(ty+"-")){for(var j=0;j<dl.length;j++){var o=dl.at(j),p=Number(o.price)||0,dep=Number(o.deposit)||0,st=o.status||'unpaid',paidPart=st==='paid'?p:(st==='deposit'?Math.min(p,dep):0),unpaidPart=Math.max(0,p-paidPart);yPaid+=paidPart;yUnpaid+=unpaidPart;yc++;if(dk.startsWith(mp)){mPaid+=paidPart;mUnpaid+=unpaidPart;mc++;}}}}document.getElementById('statsContent').innerHTML='<div class="stat-box"><div><div class="stat-label">'+monthsCz.at(currentDate.getMonth())+' '+ty+' ('+mc+' zakázek)</div><div class="stat-sub">Už zaplaceno: <b style="color:var(--grn)">'+mPaid.toLocaleString('cs-CZ')+' Kč</b><br>Zbývá vybrat: <b style="color:var(--red)">'+mUnpaid.toLocaleString('cs-CZ')+' Kč</b></div></div><div class="stat-val" style="color:var(--pri)">'+(mPaid+mUnpaid).toLocaleString('cs-CZ')+' Kč</div></div><div class="stat-box"><div><div class="stat-label">Celý rok '+ty+' ('+yc+' zakázek)</div><div class="stat-sub">Už zaplaceno: <b style="color:var(--grn)">'+yPaid.toLocaleString('cs-CZ')+' Kč</b><br>Zbývá vybrat: <b style="color:var(--red)">'+yUnpaid.toLocaleString('cs-CZ')+' Kč</b></div></div><div class="stat-val" style="color:var(--pri)">'+(yPaid+yUnpaid).toLocaleString('cs-CZ')+' Kč</div></div>';document.getElementById('statsModal').classList.add('active');}
function compressImage(f){return new Promise(function(res){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas'),s=Math.min(1,800/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7));};img.src=e.target.result;};r.readAsDataURL(f);});}
async function saveOrder(e){e.preventDefault();var client=document.getElementById('clientName').value.trim(),product=document.getElementById('productType').value.trim(),time=document.getElementById('pickupTime').value,pv=document.getElementById('orderPrice').value.trim(),price=pv?Number(pv):0,status=document.getElementById('orderStatus').value,dv=document.getElementById('orderDeposit').value.trim(),deposit=status==='deposit'&&dv?Number(dv):0,notes=document.getElementById('orderNotes').value.trim(),pIn=document.getElementById('orderPhoto'),photo=null;if(pIn.files&&pIn.files.item(0))photo=await compressImage(pIn.files.item(0));if(!Reflect.get(ordersData,selectedDateKey))Reflect.set(ordersData,selectedDateKey,new Array());var list=getDayList(selectedDateKey);if(editingIndex>-1){var old=list.at(editingIndex);list.splice(editingIndex,1,{client:client,product:product,time:time,price:price,status:status,deposit:deposit,notes:notes,photo:photo||old.photo});}else{list.push({client:client,product:product,time:time,price:price,status:status,deposit:deposit,notes:notes,photo:photo});}localStorage.setItem('bakeMapOrders',JSON.stringify(ordersData));resetFormState();renderOrdersList();renderCalendar();}
function deleteOrder(i){if(confirm("Opravdu smazat tuto zakázku?")){if(editingIndex===i)resetFormState();getDayList(selectedDateKey).splice(i,1);if(getDayList(selectedDateKey).length===0)Reflect.deleteProperty(ordersData,selectedDateKey);localStorage.setItem('bakeMapOrders',JSON.stringify(ordersData));renderOrdersList();renderCalendar();}}
function viewImage(s){document.getElementById('fullImg').src=s;document.getElementById('imgViewer').classList.add('active');}
function openBackupModal(){document.getElementById('backupModal').classList.add('active');}
function closeModal(id){document.getElementById(id).classList.remove('active');}
function closeModalOnBg(e,id){if(e.target.id===id)closeModal(id);}
function exportData(){var d="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(ordersData)),a=document.createElement('a');a.setAttribute("href",d);a.setAttribute("download","zaloha-peceni.json");document.body.appendChild(a);a.click();a.remove();}
function importData(e){var f=e.target.files.item(0);if(!f)return;var r=new FileReader();r.onload=function(ev){try{ordersData=JSON.parse(ev.target.result);localStorage.setItem('bakeMapOrders',JSON.stringify(ordersData));renderCalendar();alert("Záloha byla úspěšně obnovena!");closeModal('backupModal');}catch(err){alert("Chyba při nahrávání souboru.");}};r.readAsText(f);}
function escapeHtml(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
renderCalendar();
</script>
