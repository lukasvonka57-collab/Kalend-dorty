<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BakePlace – Plánovač zakázek</title>
    <style>
        :root {
            --bg-color: #fdf8f6;
            --card-bg: #ffffff;
            --primary: #e07a96;
            --primary-hover: #d16281;
            --primary-light: #fce7ed;
            --text-main: #4a3f44;
            --text-muted: #8c7b82;
            --border: #f0e1e6;
            --paid-bg: #d1fae5;
            --paid-text: #065f46;
            --unpaid-bg: #ffe4e6;
            --unpaid-text: #9f1239;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(224, 122, 150, 0.08);
            transition: 0.15s;
        }

        .icon-btn:hover {
            background: var(--primary-light);
        }

        .title-box {
            text-align: center;
        }

        .title-box h1 {
            color: var(--primary);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .title-box p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .calendar-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 20px rgba(224, 122, 150, 0.07);
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .month-nav h2 {
            font-size: 19px;
            font-weight: 700;
            text-transform: capitalize;
            color: var(--text-main);
        }

        .nav-arrows button {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 6px;
            transition: 0.15s;
        }

        .nav-arrows button:hover {
            background: var(--primary);
            color: white;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            aspect-ratio: 1 / 1.18;
            border-radius: 14px;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px;
            cursor: pointer;
            transition: 0.15s;
            background: #fcf9fa;
        }

        .day-cell:hover {
            background: var(--primary-light);
        }

        .day-cell.other-month {
            opacity: 0.35;
        }

        .day-cell.today {
            border: 2px solid var(--primary);
            background: var(--primary-light);
        }

        .day-num {
            font-size: 15px;
            font-weight: 700;
        }

        .order-badge {
            background: var(--primary);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 6px;
            width: 88%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .order-badge.all-paid {
            background: #6ee7b7;
            color: var(--paid-text);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 63, 68, 0.45);
            backdrop-filter: blur(2px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            border-radius: 26px 26px 0 0;
            padding: 22px;
            overflow-y: auto;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .close-btn {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .order-item {
            background: var(--bg-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
        }

        .order-item.is-paid {
            border-left-color: #34d399;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .order-client {
            font-weight: 700;
            font-size: 16px;
        }

        .order-product {
            color: var(--primary-hover);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .order-notes {
            font-size: 13px;
            color: var(--text-main);
            white-space: pre-line;
            margin-bottom: 10px;
        }

        .payment-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: 0.15s;
        }

        .payment-toggle.paid {
            background: var(--paid-bg);
            color: var(--paid-text);
        }

        .payment-toggle.unpaid {
            background: var(--unpaid-bg);
            color: var(--unpaid-text);
        }

        .payment-toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #10b981;
            cursor: pointer;
        }

        .order-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .form-group input[type="text"], .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            background: #fcf9fa;
            color: var(--text-main);
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--primary-light);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;}
async function saveOrder(e) {
e.preventDefault();
const client = document.getElementById('clientName').value.trim();
const product = document.getElementById('productType').value.trim();
const notes = document.getElementById('orderNotes').value.trim();
const paid = document.getElementById('isPaidInput').checked;
const photoInput = document.getElementById('orderPhoto');
let photoBase64 = null;
if (photoInput.files && photoInput.files[0]) {
photoBase64 = await compressImage(photoInput.files[0]);
}
if (!ordersData[selectedDateKey]) {
ordersData[selectedDateKey] = [];
}
ordersData[selectedDateKey].push({
client,
product,
notes,
paid,
photo: photoBase64
});
localStorage.setItem('bakePlaceOrders', JSON.stringify(ordersData));
document.getElementById('orderForm').reset();
renderOrdersList();
renderCalendar();
}
function deleteOrder(index) {
if (confirm("Opravdu chcete tuto zakázku smazat?")) {
ordersData[selectedDateKey].splice(index, 1);
if (ordersData[selectedDateKey].length === 0) {
delete ordersData[selectedDateKey];
}
localStorage.setItem('bakePlaceOrders', JSON.stringify(ordersData));
renderOrdersList();
renderCalendar();
}
}
function viewImage(src) {
document.getElementById('fullImg').src = src;
document.getElementById('imgViewer').classList.add('active');
}
function openBackupModal() {
document.getElementById('backupModal').classList.add('active');
}
function closeModal(id) {
document.getElementById(id).classList.remove('active');
}
function closeModalOnBg(e, id) {
if (e.target.id === id) closeModal(id);
}
function exportData() {
const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ordersData));
const dlAnchor = document.createElement('a');
dlAnchor.setAttribute("href", dataStr);
dlAnchor.setAttribute("download", zaloha-bakeplace-${new Date().toISOString().slice(0,10)}.json);
document.body.appendChild(dlAnchor);
dlAnchor.click();
dlAnchor.remove();
}
function importData(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (event) => {
try {
ordersData = JSON.parse(event.target.result);
localStorage.setItem('bakePlaceOrders', JSON.stringify(ordersData));
renderCalendar();
alert("Záloha byla úspěšně obnovena!");
closeModal('backupModal');
} catch (err) {
alert("Chyba při nahrávání souboru.");
}
};
reader.readAsText(file);
}
function escapeHtml(text) {
const div = document.createElement('div');
div.textContent = text;
return div.innerHTML;
}
renderCalendar();
