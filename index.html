<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BakeMap – Plánovač zakázek</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--pri:#d97706;--pri-l:#fef3c7;--txt:#1f2937;--mut:#6b7280;--brd:#e5e7eb;--red:#ef4444;--grn:#10b981}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--txt);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
header{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.icon-btn{background:var(--card);border:1px solid var(--brd);border-radius:12px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.title-box{text-align:center}.title-box h1{color:var(--pri);font-size:24px;font-weight:800}.title-box p{color:var(--mut);font-size:13px}
.calendar-card{background:var(--card);width:100%;max-width:500px;border-radius:20px;padding:18px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.month-nav h2{font-size:19px;font-weight:700}
.nav-arrows button{background:var(--bg);border:none;border-radius:10px;width:36px;height:36px;font-size:16px;font-weight:700;cursor:pointer;margin-left:6px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:10px}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-cell{aspect-ratio:1/1.15;border-radius:12px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;cursor:pointer;background:#fafafa}
.day-cell:hover{background:var(--pri-l)}.day-cell.other-month{opacity:.35}.day-cell.today{border:2px solid var(--pri);background:#fffbeb}
.day-num{font-size:15px;font-weight:700}.order-badge{background:var(--pri);color:#fff;font-size:10px;font-weight:700;padding:2px 4px;border-radius:6px;width:90%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats-btn{width:100%;max-width:500px;margin-top:14px;background:var(--card);border:1px solid var(--brd);color:var(--txt);padding:14px;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;gap:8px}
.stats-btn:hover{background:var(--pri-l);border-color:var(--pri)}
.stat-box{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.stat-label{font-size:14px;color:var(--mut);font-weight:600}.stat-sub{font-size:12px;color:var(--mut);margin-top:2px}.stat-val{font-size:20px;font-weight:800;color:var(--grn)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}.modal-overlay.active{display:flex}
.modal-content{background:var(--card);width:100%;max-width:500px;max-height:90vh;border-radius:24px 24px 0 0;padding:20px;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--brd)}
.close-btn{background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
.order-item{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px;border-left:4px solid var(--pri)}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}.order-client{font-weight:700;font-size:16px}
.order-product{color:var(--pri);font-weight:600;font-size:14px;margin-bottom:4px}.order-price{color:var(--grn);font-weight:700;font-size:14px;margin-bottom:6px}
.order-notes{font-size:13px;white-space:pre-line;margin-bottom:8px}
.order-img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:6px;cursor:pointer}
.delete-btn{background:#fee2e2;color:var(--red);border:none;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.form-group{margin-bottom:12px}.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--mut)}
.form-group input,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--brd);border-radius:10px;font-size:14px}
.btn-primary{background:var(--pri);color:#fff;border:none;width:100%;padding:12px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.section-divider{margin:18px 0 12px;font-size:15px;font-weight:700}
.img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.img-viewer.active{display:flex}.img-viewer img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<header><button class="icon-btn" onclick="openBackupModal()">⚙️</button><div class="title-box"><h1>BakeMap</h1><p>Plánovač zakázek a pečení</p></div><button class="icon-btn" onclick="goToToday()">📅</button></header>
<div class="calendar-card"><div class="month-nav"><h2 id="monthYearLabel"></h2><div class="nav-arrows"><button onclick="changeMonth(-1)">‹</button><button onclick="changeMonth(1)">›</button></div></div><div class="weekdays"><div>PO</div><div>ÚT</div><div>ST</div><div>ČT</div><div>PÁ</div><div>SO</div><div>NE</div></div><div class="days-grid" id="daysGrid"></div></div>
<button class="stats-btn" onclick="openStatsModal()">💰 Přehled tržeb (měsíc / rok)</button>
<div class="modal-overlay" id="dayModal" onclick="closeModalOnBg(event,'dayModal')"><div class="modal-content"><div class="modal-header"><h3 id="selectedDateTitle"></h3><button class="close-btn" onclick="closeModal('dayModal')">✕</button></div><div id="ordersList"></div><div class="section-divider">➕ Přidat novou zakázku</div><form id="orderForm" onsubmit="saveOrder(event)"><div class="form-group"><label>Jméno zákazníka *</label><input type="text" id="clientName" placeholder="Např. Paní Nováková" required></div><div class="form-group"><label>Co se bude péct *</label><input type="text" id="productType" placeholder="Např. Čokoládový dort" required></div><div class="form-group"><label>Cena (Kč)</label><input type="number" id="orderPrice" placeholder="Např. 1200" min="0" step="1"></div><div class="form-group"><label>Požadavky a detaily</label><textarea id="orderNotes" rows="3" placeholder="Bez ořechů, nápis, čas vyzvednutí..."></textarea></div><div class="form-group"><label>Referenční fotka</label><input type="file" id="orderPhoto" accept="image/*"></div><button type="submit" class="btn-primary">Uložit zakázku</button></form></div></div>
<div class="modal-overlay" id="statsModal" onclick="closeModalOnBg(event,'statsModal')"><div class="modal-content"><div class="modal-header"><h3>💰 Přehled tržeb</h3><button class="close-btn" onclick="closeModal('statsModal')">✕</button></div><div class="stat-box"><div><div class="stat-label" id="monthStatLabel">Tržby za měsíc</div><div class="stat-sub" id="monthStatCount">0 zakázek</div></div><div class="stat-val" id="monthStatValue">0 Kč</div></div><div class="stat-box"><div><div class="stat-label" id="yearStatLabel">Celkové tržby za rok</div><div class="stat-sub" id="yearStatCount">0 zakázek</div></div><div class="stat-val" id="yearStatValue">0 Kč</div></div></div></div>
<div class="modal-overlay" id="backupModal" onclick="closeModalOnBg(event,'backupModal')"><div class="modal-content"><div class="modal-header"><h3>Záloha dat</h3><button class="close-btn" onclick="closeModal('backupModal')">✕</button></div><button class="btn-primary" onclick="exportData()" style="margin-bottom:12px">⬇️ Stáhnout zálohu</button><div class="form-group"><label>Obnovit ze souboru:</label><input type="file" accept=".json" onchange="importData(event)"></div></div></div>
<div class="img-viewer" id="imgViewer" onclick="this.classList.remove('active')"><img id="fullImg" src=""></div>
<script>
var currentDate=new Date(),selectedDateKey="",ordersData=JSON.parse(localStorage.getItem('bakeMapOrders'))||{};
var monthsCz=new Array("Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec");
function renderCalendar(){var y=currentDate.getFullYear(),m=currentDate.getMonth();document.getElementById('monthYearLabel').textContent=monthsCz.at(m)+" "+y;var f=new Date(y,m,1),l=new Date(y,m+1,0),s=f.getDay()-1;if(s===-1)s=6;var g=document.getElementById('daysGrid');g.innerHTML="";var p=new Date(y,m,0).getDate(),t=new Date();for(var i=s;i>0;i--)g.appendChild(createDayCell(y,m-1,p-i+1,true));for(var d=1;d<=l.getDate();d++)g.appendChild(createDayCell(y,m,d,false,d===t.getDate()&&m===t.getMonth()&&y===t.getFullYear()));var r=(g.children.length<=35?35:42)-g.children.length;for(var d=1;d<=r;d++)g.appendChild(createDayCell(y,m+1,d,true));}
function createDayCell(y,m,d,o,t){var dt=new Date(y,m,d),k=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,'0')+"-"+String(dt.getDate()).padStart(2,'0'),c=document.createElement('div');c.className="day-cell"+(o?" other-month":"")+(t?" today":"");c.onclick=function(){openDayModal(k,dt);};var n=document.createElement('span');n.className='day-num';n.textContent=dt.getDate();c.appendChild(n);var doList=ordersData[k]||[];if(doList.length>0){var b=document.createElement('div');b.className='order-badge';b.textContent=doList.length===1?doList.at(0).client:doList.length+" zakázky";c.appendChild(b);}return c;}
function changeMonth(d){currentDate.setMonth(currentDate.getMonth()+d);renderCalendar();}
function goToToday(){currentDate=new Date();renderCalendar();}
function openDayModal(k,dt){selectedDateKey=k;document.getElementById('selectedDateTitle').textContent=dt.getDate()+". "+monthsCz.at(dt.getMonth()).toLowerCase()+" "+dt.getFullYear();renderOrdersList();document.getElementById('dayModal').classList.add('active');}
function renderOrdersList(){var l=document.getElementById('ordersList'),doList=ordersData[selectedDateKey]||[];if(doList.length===0){l.innerHTML='<p style="color:var(--mut);font-size:14px;text-align:center;padding:10px 0">Na tento den zatím nejsou žádné zakázky.</p>';return;}var h="";for(var i=0;i<doList.length;i++){var o=doList.at(i),pr=Number(o.price)||0;h+='<div class="order-item"><div class="order-top"><div class="order-client">👤 '+escapeHtml(o.client)+'</div><button class="delete-btn" onclick="deleteOrder('+i+')">Smazat</button></div><div class="order-product">🎂 '+escapeHtml(o.product)+'</div>';if(pr>0)h+='<div class="order-price">💵 '+pr.toLocaleString('cs-CZ')+' Kč</div>';if(o.notes)h+='<div class="order-notes">'+escapeHtml(o.notes)+'</div>';if(o.photo)h+='<img src="'+o.photo+'" class="order-img" onclick="viewImage(this.src)">';h+='</div>';}l.innerHTML=h;}
function openStatsModal(){var ty=String(currentDate.getFullYear()),mp=ty+"-"+String(currentDate.getMonth()+1).padStart(2,'0'),ms=0,mc=0,ys=0,yc=0,ks=Object.keys(ordersData);for(var k=0;k<ks.length;k++){var dk=ks.at(k),dl=ordersData[dk]||[];if(dk.startsWith(ty+"-")){for(var j=0;j<dl.length;j++){var p=Number(dl.at(j).price)||0;ys+=p;yc++;if(dk.startsWith(mp)){ms+=p;mc++;}}}}document.getElementById('monthStatLabel').textContent="Tržby: "+monthsCz.at(currentDate.getMonth())+" "+ty;document.getElementById('monthStatValue').textContent=ms.toLocaleString('cs-CZ')+" Kč";document.getElementById('monthStatCount').textContent="Počet zakázek v měsíci: "+mc;document.getElementById('yearStatLabel').textContent="Celkové tržby za rok "+ty;document.getElementById('yearStatValue').textContent=ys.toLocaleString('cs-CZ')+" Kč";document.getElementById('yearStatCount').textContent="Počet zakázek v roce: "+yc;document.getElementById('statsModal').classList.add('active');}
function compressImage(f){return new Promise(function(res){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas'),s=Math.min(1,800/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7));};img.src=e.target.result;};r.readAsDataURL(f);});}
async function saveOrder(e){e.preventDefault();var client=document.getElementById('clientName').value.trim(),product=document.getElementById('productType').value.trim(),pv=document.getElementById('orderPrice').value.trim(),price=pv?Number(pv):0,notes=document.getElementById('orderNotes').value.trim(),pIn=document.getElementById('orderPhoto'),photo=null;if(pIn.files&&pIn.files.item(0))photo=await compressImage(pIn.files.item(0));if(!ordersData[selectedDateKey])ordersData[selectedDateKey]=new Array();ordersData[selectedDateKey].push({client:client,product:product,price:price,notes:notes,photo:photo});localStorage.setItem('bakeMapOrders',JSON.stringify(ordersData));document.getElementById('orderForm').reset();renderOrdersList();renderCalendar();}
function deleteOrder(i){if(confirm("Smazat zakázku?")){ordersData[selectedDateKey].splice(i,1);if(ordersData[selectedDateKey].length===0)delete ordersData[selectedDateKey];localStorage.setItem('bakeMapOrders',JSON.stringify(ordersData));renderOrdersList();renderCalendar();}}
function viewImage(s){document.getElementById('fullImg').src=s;document.getElementById('imgViewer').classList.add('active');}
function openBackupModal(){document.getElementById('backupModal').classList.add('active');}
function closeModal(id){document.getElementById(id).classList.remove('active');}
function closeModalOnBg(e,id){if(e.target.id===id)closeModal(id);}
function exportData(){var d="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(ordersData)),a=document.createElement('a');a.setAttribute("href",d);a.setAttribute("download","zaloha-peceni.json");document.body.appendChild(a);a.click();a.remove();}
function importData(e){var f=e.target.files.item(0);if(!f)return;var r=new FileReader();r.onload=function(ev){try{ordersData=JSON.parse(ev.target.result);localStorage.setItem('bakeMapOrders',JSON.stringify(ordersData));renderCalendar();alert("Obnoveno!");closeModal('backupModal');}catch(err){alert("Chyba souboru.");}};r.readAsText(f);}
function escapeHtml(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
renderCalendar();
</script>
</body>
</html>
