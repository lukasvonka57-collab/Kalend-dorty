<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BakeMap – Plánovač zakázek</title>
    <style>
        :root {
            --bg: #fdf8f5;
            --card: rgba(255, 255, 255, 0.88);
            --pri: #c26d42;
            --pri-l: #fae8df;
            --txt: #3e2723;
            --mut: #8d6e63;
            --brd: rgba(194, 109, 66, 0.2);
            --red: #d9534f;
            --ora: #f0ad4e;
            --grn: #5cb85c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--txt);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            transition: background-image 0.5s ease;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(253, 248, 245, 0.84);
            z-index: -1;
        }
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 8px;
        }
        .hdr-right { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--brd);
            border-radius: 14px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(62, 39, 35, 0.05);
        }
        .title-box { text-align: center; flex: 1; }
        .title-box h1 { color: var(--pri); font-size: 23px; font-weight: 800; }
        .title-box p { color: var(--mut); font-size: 12px; }
        .calendar-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--brd);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(62, 39, 35, 0.07);
        }
        .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .month-nav h2 { font-size: 19px; font-weight: 700; }
        .nav-arrows button {
            background: var(--pri-l);
            color: var(--pri);
            border: none;
            border-radius: 12px;
            width: 36px;
            height: 36px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 6px;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--mut);
            margin-bottom: 10px;
        }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .day-cell {
            aspect-ratio: 1 / 1.15;
            border-radius: 14px;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.65);
        }
        .day-cell.other-month { opacity: 0.35; }
        .day-cell.today { border: 2px solid var(--pri); background: #fff; }
        .day-num { font-size: 15px; font-weight: 700; }
        .order-badge {
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 4px;
            border-radius: 6px;
            width: 92%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .st-unpaid { background: var(--red); }
        .st-deposit { background: var(--ora); }
        .st-paid { background: var(--grn); }
        .bottom-actions {
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .action-btn {
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--brd);
            color: var(--txt);
            padding: 14px 10px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(62, 39, 35, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(62, 39, 35, 0.45);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fffaf7;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            border-radius: 26px 26px 0 0;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--brd);
        }
        .close-btn {
            background: var(--pri-l);
            color: var(--pri);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
        }
        .order-item {
            background: #fff;
            border: 1px solid var(--brd);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 5px solid var(--pri);
        }
        .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .order-client { font-weight: 700; font-size: 16px; }
        .time-tag {
            display: inline-block;
            background: var(--pri-l);
            color: var(--pri);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .order-product { color: var(--pri); font-weight: 700; font-size: 14px; margin-bottom: 6px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
        .order-price { font-weight: 800; font-size: 15px; }
        .status-pill { border: none; color: #fff; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 20px; cursor: pointer; }
        .deposit-box { background: #fff8eb; border: 1px solid #f0ad4e; border-radius: 12px; padding: 10px; margin: 8px 0; }
        .deposit-inputs { display: flex; gap: 8px; margin-top: 6px; }
        .deposit-inputs input { flex: 1; padding: 7px 10px; border: 1px solid var(--brd); border-radius: 8px; font-size: 14px; }
        .deposit-save { background: var(--ora); color: #fff; border: none; padding: 7px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .deposit-info { font-size: 12px; color: #b45309; font-weight: 600; margin-top: 6px; }
        .order-notes { font-size: 13px; white-space: pre-line; margin-bottom: 8px; color: #5d4037; }
        .order-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin-top: 6px; cursor: pointer; }
        .delete-btn { background: #fee2e2; color: var(--red); border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--mut); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--brd);
            border-radius: 12px;
            font-size: 14px;
            background: #fff;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-primary {
            background: var(--pri);
            color: #fff;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }
        .stat-box {
            background: #fff;
            border: 1px solid var(--brd);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-label { font-size: 14px; font-weight: 700; }
        .stat-sub { font-size: 12px; color: var(--mut); margin-top: 2px; }
        .stat-val { font-size: 19px; font-weight: 800; }
        .week-day-group { margin-bottom: 14px; }
        .week-day-title { font-size: 14px; font-weight: 800; color: var(--pri); margin-bottom: 6px; text-transform: capitalize; }
        .search-input { width: 100%; padding: 12px 14px; border: 2px solid var(--pri); border-radius: 14px; font-size: 15px; margin-bottom: 14px; background: #fff; }
        .search-card { background: #fff; border: 1px solid var(--brd); border-radius: 14px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
        .img-viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .img-viewer.active { display: flex; }
        .img-viewer img { max-width: 100%; max-height: 100%; border-radius: 12px; }
    </style>
</head>
<body>
    <header>
        <button class="icon-btn" onclick="openBackupModal()">⚙️</button>
        <div class="title-box">
            <h1>BakeMap</h1>
            <p>Plánovač zakázek a pečení</p>
        </div>
        <div class="hdr-right">
            <button class="icon-btn" onclick="openSearchModal()">🔍</button>
            <button class="icon-btn" onclick="goToToday()">📅</button>
        </div>
    </header>

    <div class="calendar-card">
        <div class="month-nav">
            <h2 id="monthYearLabel"></h2>
            <div class="nav-arrows">
                <button onclick="changeMonth(-1)">‹</button>
                <button onclick="changeMonth(1)">›</button>
            </div>
        </div>
        <div class="weekdays">
            <div>PO</div><div>ÚT</div><div>ST</div><div>ČT</div><div>PÁ</div><div>SO</div><div>NE</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="bottom-actions">
        <button class="action-btn" onclick="openWeekModal()">📋 Plán na 7 dní</button>
        <button class="action-btn" onclick="openStatsModal()">💰 Přehled tržeb</button>
    </div>

    <div class="modal-overlay" id="dayModal" onclick="closeModalOnBg(event,'dayModal')">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="selectedDateTitle"></h3>
                <button class="close-btn" onclick="closeModal('dayModal')">✕</button>
            </div>
            <div id="ordersList"></div>
            <div style="margin:18px 0 12px;font-size:15px;font-weight:700">➕ Přidat novou zakázku</div>
            <form id="orderForm" onsubmit="saveOrder(event)">
                <div class="form-group">
                    <label>Jméno zákazníka *</label>
                    <input type="text" id="clientName" placeholder="Např. Paní Nováková" required>
                </div>
                <div class="form-group">
                    <label>Co se bude péct *</label>
                    <input type="text" id="productType" placeholder="Např. Čokoládový dort" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Čas vyzvednutí</label>
                        <input type="time" id="pickupTime">
                    </div>
                    <div class="form-group">
                        <label>Celková cena (Kč)</label>
                        <input type="number" id="orderPrice" placeholder="1200" min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Stav platby</label>
                    <select id="orderStatus" onchange="toggleFormDeposit()">
                        <option value="unpaid">🔴 Nezaplaceno</option>
                        <option value="deposit">🟠 Záloha</option>
                        <option value="paid">🟢 Zaplaceno / Hotovo</option>
                    </select>
                </div>
                <div class="form-group" id="formDepositGroup" style="display:none">
                    <label>Výše složené zálohy (Kč)</label>
                    <input type="number" id="orderDeposit" placeholder="Např. 500" min="0">
                </div>
                <div class="form-group">
                    <label>Požadavky a detaily</label>
                    <textarea id="orderNotes" rows="3" placeholder="Příchuť, bez ořechů, nápis..."></textarea>
                </div>
                <div class="form-group">
                    <label>Referenční fotka</label>
                    <input type="file" id="orderPhoto" accept="image/*">
                </div>
                <button type="submit" class="btn-primary">Uložit zakázku</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="searchModal" onclick="closeModalOnBg(event,'searchModal')">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔍 Vyhledat zakázku</h3>
                <button class="close-btn" onclick="closeModal('searchModal')">✕</button>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="Zadejte jméno, dort nebo poznámku..." oninput="runSearch()">
            <div id="searchResults"></div>
        </div>
    </div>

    <div class="modal-overlay" id="weekModal" onclick="closeModalOnBg(event,'weekModal')">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 Plán na nejbližších 7 dní</h3>
                <button class="close-btn" onclick="closeModal('weekModal')">✕</button>
            </div>
            <div id="weekList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="statsModal" onclick="closeModalOnBg(event,'statsModal')">
        <div class="modal-content">
            <div class="modal-header">
                <h3>💰 Přehled tržeb</h3>
                <button class="close-btn" onclick="closeModal('statsModal')">✕</button>
            </div>
            <div id="statsContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="backupModal" onclick="closeModalOnBg(event,'backupModal')">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Záloha dat</h3>
                <button class="close-btn" onclick="closeModal('backupModal')">✕</button>
            </div>
            <button class="btn-primary" onclick="exportData()" style="margin-bottom:12px">⬇️ Stáhnout zálohu</button>
            <div class="form-group">
                <label>Obnovit ze souboru:</label>
                <input type="file" accept=".json" onchange="importData(event)">
            </div>
        </div>
    </div>

    <div class="img-viewer" id="imgViewer" onclick="this.classList.remove('active')">
        <img id="fullImg" src="">
    </div>

    <script>
        var currentDate = new Date();
        var selectedDateKey = "";
        var ordersData = JSON.parse(localStorage.getItem('bakeMapOrders')) || {};
        var monthsCz = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
        var cakePhotos = [
            "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=900&q=80",
            "https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=900&q=80",
            "https://images.unsplash.com/photo-1535141192574-5d4897c12636?w=900&q=80",
            "https://images.unsplash.com/photo-1557925923-cd4648e211a0?w=900&q=80",
            "https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=900&q=80",
            "https://images.unsplash.com/photo-1588195538326-c5b1e9f80a1b?w=900&q=80",
            "https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?w=900&q=80",
            "https://images.unsplash.com/photo-1621303837174-89787a7d4729?w=900&q=80",
            "https://images.unsplash.com/photo-1542826438-bd32f43d626f?w=900&q=80",
            "https://images.unsplash.com/photo-1519340333755-56e9c1d04579?w=900&q=80",
            "https://images.unsplash.com/photo-1550617931-e17a7b70dce2?w=900&q=80",
            "https://images.unsplash.com/photo-1606890737304-57a1ca8a5b62?w=900&q=80"
        ];

        function renderCalendar() {
            var y = currentDate.getFullYear(), m = currentDate.getMonth();
            document.body.style.backgroundImage = "url('" + cakePhotos[m] + "')";
            document.getElementById('monthYearLabel').textContent = monthsCz[m] + " " + y;
            var f = new Date(y, m, 1), l = new Date(y, m + 1, 0), s = f.getDay() - 1;
            if (s === -1) s = 6;
            var g = document.getElementById('daysGrid');
            g.innerHTML = "";
            var p = new Date(y, m, 0).getDate(), t = new Date();
            for (var i = s; i > 0; i--) g.appendChild(createDayCell(y, m - 1, p - i + 1, true));
            for (var d = 1; d <= l.getDate(); d++) g.appendChild(createDayCell(y, m, d, false, d === t.getDate() && m === t.getMonth() && y === t.getFullYear()));
            var r = (g.children.length <= 35 ? 35 : 42) - g.children.length;
            for (var d = 1; d <= r; d++) g.appendChild(createDayCell(y, m + 1, d, true));
        }

        function createDayCell(y, m, d, o, t) {
            var dt = new Date(y, m, d);
            var k = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, '0') + "-" + String(dt.getDate()).padStart(2, '0');
            var c = document.createElement('div');
            c.className = "day-cell" + (o ? " other-month" : "") + (t ? " today" : "");
            c.onclick = function() { openDayModal(k, dt); };
            var n = document.createElement('span');
            n.className = 'day-num';
            n.textContent = dt.getDate();
            c.appendChild(n);
            var doList = ordersData[k] || [];
            if (doList.length > 0) {
                var b = document.createElement('div'), first = doList[0], st = first.status || 'unpaid';
                b.className = 'order-badge st-' + st;
                b.textContent = doList.length === 1 ? first.client : doList.length + " zakázky";
                c.appendChild(b);
            }
            return c;
        }

        function changeMonth(d) { currentDate.setMonth(currentDate.getMonth() + d); renderCalendar(); }
         function goToToday() { currentDate = new Date(); renderCalendar(); }
        function toggleFormDeposit() {
            var st = document.getElementById('orderStatus').value;
            document.getElementById('formDepositGroup').style.display = st === 'deposit' ? 'block' : 'none';
        }
        function openDayModal(k, dt) {
            selectedDateKey = k;
            document.getElementById('selectedDateTitle').textContent = dt.getDate() + ". " + monthsCz[dt.getMonth()].toLowerCase() + " " + dt.getFullYear();
            renderOrdersList();
            document.getElementById('dayModal').classList.add('active');
        }
        function getStatusLabel(st) {
            if (st === 'paid') return '🟢 Zaplaceno';
            if (st === 'deposit') return '🟠 Záloha';
            return '🔴 Nezaplaceno';
        }
        function cycleStatus(idx) {
            var o = ordersData[selectedDateKey][idx], cur = o.status || 'unpaid';
            if (cur === 'unpaid') o.status = 'deposit';
            else if (cur === 'deposit') o.status = 'paid';
            else o.status = 'unpaid';
            localStorage.setItem('bakeMapOrders', JSON.stringify(ordersData));
            renderOrdersList();
            renderCalendar();
        }
        function updateDeposit(idx) {
            var val = Number(document.getElementById('depInput_' + idx).value) || 0;
            ordersData[selectedDateKey][idx].deposit = val;
            localStorage.setItem('bakeMapOrders', JSON.stringify(ordersData));
            renderOrdersList();
            renderCalendar();
        }
        function renderOrdersList() {
            var l = document.getElementById('ordersList'), doList = ordersData[selectedDateKey] || [];
            if (doList.length === 0) {
                l.innerHTML = '<p style="color:var(--mut);font-size:14px;text-align:center;padding:10px 0">Na tento den zatím nejsou žádné zakázky.</p>';
                return;
            }
            doList.sort(function(a, b) { return (a.time || '99:99').localeCompare(b.time || '99:99'); });
            var h = "";
            for (var i = 0; i < doList.length; i++) {
                var o = doList[i], pr = Number(o.price) || 0, dep = Number(o.deposit) || 0, st = o.status || 'unpaid';
                h += '<div class="order-item"><div class="order-top"><div class="order-client">👤 ' + escapeHtml(o.client) + '</div><button class="delete-btn" onclick="deleteOrder(' + i + ')">Smazat</button></div>';
                if (o.time) h += '<div class="time-tag">🕒 Vyzvednutí: ' + escapeHtml(o.time) + '</div>';
                h += '<div class="order-product">🎂 ' + escapeHtml(o.product) + '</div><div class="price-row"><div class="order-price">💵 ' + (pr > 0 ? pr.toLocaleString('cs-CZ') + ' Kč' : 'Cena nezadána') + '</div><button class="status-pill st-' + st + '" onclick="cycleStatus(' + i + ')">' + getStatusLabel(st) + '</button></div>';
                if (st === 'deposit') {
                    var rem = Math.max(0, pr - dep);
                    h += '<div class="deposit-box"><label style="font-size:12px;font-weight:700;color:#92400e">Záloha celkem (Kč) – lze kdykoli navýšit:</label><div class="deposit-inputs"><input type="number" id="depInput_' + i + '" value="' + dep + '" min="0"><button class="deposit-save" onclick="updateDeposit(' + i + ')">Uložit</button></div>';
                    if (pr > 0) h += '<div class="deposit-info">Složeno: ' + dep.toLocaleString('cs-CZ') + ' Kč | Zbývá doplatit: ' + rem.toLocaleString('cs-CZ') + ' Kč</div>';
                    h += '</div>';
                }
                if (o.notes) h += '<div class="order-notes">' + escapeHtml(o.notes) + '</div>';
                if (o.photo) h += '<img src="' + o.photo + '" class="order-img" onclick="viewImage(this.src)">';
                h += '</div>';
            }
            l.innerHTML = h;
        }
        function openSearchModal() {
            document.getElementById('searchInput').value = "";
            runSearch();
            document.getElementById('searchModal').classList.add('active');
            setTimeout(function() { document.getElementById('searchInput').focus(); }, 100);
        }
        function runSearch() {
            var q = document.getElementById('searchInput').value.trim().toLowerCase();
            var resEl = document.getElementById('searchResults');
            var ks = Object.keys(ordersData).sort().reverse();
            var matches = [];
            for (var k = 0; k < ks.length; k++) {
                var dk = ks[k], dl = ordersData[dk] || [];
                for (var j = 0; j < dl.length; j++) {
                    var o = dl[j], txt = (o.client + " " + o.product + " " + (o.notes || "")).toLowerCase();
                    if (!q || txt.indexOf(q) !== -1) matches.push({ key: dk, order: o });
                }
            }
            if (matches.length === 0) {
                resEl.innerHTML = '<p style="color:var(--mut);text-align:center;padding:16px 0">Žádná zakázka nenalezena.</p>';
                return;
            }
            var h = "";
            for (var i = 0; i < matches.length; i++) {
                var m = matches[i], parts = m.key.split("-");
                var dStr = Number(parts[2]) + ". " + monthsCz[Number(parts[1]) - 1].toLowerCase() + " " + parts[0];
                var pr = Number(m.order.price) || 0;
                h += '<div class="search-card" onclick="jumpToDate('' + m.key + '')"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--pri);font-weight:700;margin-bottom:4px"><span>📅 ' + dStr + (m.order.time ? ' • 🕒 ' + escapeHtml(m.order.time) : '') + '</span><span>' + (pr > 0 ? pr.toLocaleString('cs-CZ') + ' Kč' : '') + '</span></div><div style="font-weight:700;font-size:15px">👤 ' + escapeHtml(m.order.client) + ' – 🎂 ' + escapeHtml(m.order.product) + '</div>';
                if (m.order.notes) h += '<div style="font-size:12px;color:var(--mut);margin-top:3px">' + escapeHtml(m.order.notes) + '</div>';
                h += '</div>';
            }
            resEl.innerHTML = h;
        }
        function jumpToDate(k) {
            var parts = k.split("-");
            var dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            closeModal('searchModal');
            currentDate = new Date(dt.getFullYear(), dt.getMonth(), 1);
            renderCalendar();
            openDayModal(k, dt);
        }
        function openWeekModal() {
            var wl = document.getElementById('weekList'), h = "", found = false, base = new Date();
            for (var i = 0; i < 7; i++) {
                var dt = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
                var k = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, '0') + "-" + String(dt.getDate()).padStart(2, '0');
                var dl = ordersData[k] || [];
                if (dl.length > 0) {
                    found = true;
                    dl.sort(function(a, b) { return (a.time || '99:99').localeCompare(b.time || '99:99'); });
                    h += '<div class="week-day-group"><div class="week-day-title">' + (i === 0 ? 'Dnes – ' : i === 1 ? 'Zítra – ' : '') + dt.getDate() + '. ' + monthsCz[dt.getMonth()].toLowerCase() + '</div>';
                    for (var j = 0; j < dl.length; j++) {
                        var o = dl[j];
                        h += '<div class="order-item" style="margin-bottom:8px;padding:10px"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span>' + (o.time ? '🕒 ' + escapeHtml(o.time) + ' – ' : '') + escapeHtml(o.client) + '</span><span>' + (o.price ? Number(o.price).toLocaleString('cs-CZ') + ' Kč' : '') + '</span></div><div style="color:var(--pri);font-size:13px;font-weight:600">🎂 ' + escapeHtml(o.product) + '</div>' + (o.notes ? '<div style="font-size:12px;color:#5d4037;margin-top:3px">' + escapeHtml(o.notes) + '</div>' : '') + '</div>';
                    }
                    h += '</div>';
                }
            }
            if (!found) h = '<p style="color:var(--mut);text-align:center;padding:20px 0">Na nejbližších 7 dní nemáte žádné naplánované zakázky.</p>';
            wl.innerHTML = h;
            document.getElementById('weekModal').classList.add('active');
                    }
        function openStatsModal() {
            var ty = String(currentDate.getFullYear()), mp = ty + "-" + String(currentDate.getMonth() + 1).padStart(2, '0');
            var mPaid = 0, mUnpaid = 0, mc = 0, yPaid = 0, yUnpaid = 0, yc = 0;
            var ks = Object.keys(ordersData);
            for (var k = 0; k < ks.length; k++) {
                var dk = ks[k], dl = ordersData[dk] || [];
                if (dk.startsWith(ty + "-")) {
                    for (var j = 0; j < dl.length; j++) {
                        var o = dl[j], p = Number(o.price) || 0, dep = Number(o.deposit) || 0, st = o.status || 'unpaid';
                        var paidPart = st === 'paid' ? p : (st === 'deposit' ? Math.min(p, dep) : 0);
                        var unpaidPart = Math.max(0, p - paidPart);
                        yPaid += paidPart; yUnpaid += unpaidPart; yc++;
                        if (dk.startsWith(mp)) { mPaid += paidPart; mUnpaid += unpaidPart; mc++; }
                    }
                }
            }
            document.getElementById('statsContent').innerHTML =
                '<div class="stat-box"><div><div class="stat-label">' + monthsCz[currentDate.getMonth()] + ' ' + ty + ' (' + mc + ' zakázek)</div><div class="stat-sub">Už zaplaceno: <b style="color:var(--grn)">' + mPaid.toLocaleString('cs-CZ') + ' Kč</b><br>Zbývá vybrat: <b style="color:var(--red)">' + mUnpaid.toLocaleString('cs-CZ') + ' Kč</b></div></div><div class="stat-val" style="color:var(--pri)">' + (mPaid + mUnpaid).toLocaleString('cs-CZ') + ' Kč</div></div>' +
                '<div class="stat-box"><div><div class="stat-label">Celý rok ' + ty + ' (' + yc + ' zakázek)</div><div class="stat-sub">Už zaplaceno: <b style="color:var(--grn)">' + yPaid.toLocaleString('cs-CZ') + ' Kč</b><br>Zbývá vybrat: <b style="color:var(--red)">' + yUnpaid.toLocaleString('cs-CZ') + ' Kč</b></div></div><div class="stat-val" style="color:var(--pri)">' + (yPaid + yUnpaid).toLocaleString('cs-CZ') + ' Kč</div></div>';
            document.getElementById('statsModal').classList.add('active');
        }
        function compressImage(f) {
            return new Promise(function(res) {
                var r = new FileReader();
                r.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var c = document.createElement('canvas'), s = Math.min(1, 800 / img.width);
                        c.width = img.width * s; c.height = img.height * s;
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        res(c.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                r.readAsDataURL(f);
            });
        }
        async function saveOrder(e) {
            e.preventDefault();
            var client = document.getElementById('clientName').value.trim();
            var product = document.getElementById('productType').value.trim();
            var time = document.getElementById('pickupTime').value;
            var pv = document.getElementById('orderPrice').value.trim();
            var price = pv ? Number(pv) : 0;
            var status = document.getElementById('orderStatus').value;
            var dv = document.getElementById('orderDeposit').value.trim();
            var deposit = status === 'deposit' && dv ? Number(dv) : 0;
            var notes = document.getElementById('orderNotes').value.trim();
            var pIn = document.getElementById('orderPhoto'), photo = null;
            if (pIn.files && pIn.files[0]) photo = await compressImage(pIn.files[0]);
            if (!ordersData[selectedDateKey]) ordersData[selectedDateKey] = [];
            ordersData[selectedDateKey].push({ client: client, product: product, time: time, price: price, status: status, deposit: deposit, notes: notes, photo: photo });
            localStorage.setItem('bakeMapOrders', JSON.stringify(ordersData));
            document.getElementById('orderForm').reset();
            toggleFormDeposit();
            renderOrdersList();
            renderCalendar();
        }
        function deleteOrder(i) {
            if (confirm("Opravdu smazat tuto zakázku?")) {
                ordersData[selectedDateKey].splice(i, 1);
                if (ordersData[selectedDateKey].length === 0) delete ordersData[selectedDateKey];
                localStorage.setItem('bakeMapOrders', JSON.stringify(ordersData));
                renderOrdersList();
                renderCalendar();
            }
        }
        function viewImage(s) { document.getElementById('fullImg').src = s; document.getElementById('imgViewer').classList.add('active'); }
        function openBackupModal() { document.getElementById('backupModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeModalOnBg(e, id) { if (e.target.id === id) closeModal(id); }
        function exportData() {
            var d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ordersData));
            var a = document.createElement('a');
            a.setAttribute("href", d);
            a.setAttribute("download", "zaloha-peceni.json");
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
        function importData(e) {
            var f = e.target.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function(ev) {
                try {
                    ordersData = JSON.parse(ev.target.result);
                    localStorage.setItem('bakeMapOrders', JSON.stringify(ordersData));
                    renderCalendar();
                    alert("Záloha byla úspěšně obnovena!");
                    closeModal('backupModal');
                } catch (err) { alert("Chyba při nahrávání souboru."); }
            };
            r.readAsText(f);
        }
        function escapeHtml(t) {
            var d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }
        renderCalendar();
    </script>
</body>
</html>
